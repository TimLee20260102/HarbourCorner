<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微光 - Glimmer</title>
    <style>
        :root {
            --bg-color: #0d1310;
            --text-color: #D1C7BD;
            --hint-color: #8C827A;
            --accent-color: #EEDC82;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 70px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .page.active {
            display: flex;
        }

        /* --- 1. 釋放樹洞 --- */
        .cave-container {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .cave-hole {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.9) 0%, rgba(13, 19, 16, 0.5) 50%, rgba(13, 19, 16, 0) 70%);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 1), 0 0 30px rgba(74, 93, 82, 0.2);
            z-index: -1;
            animation: caveBreathe 6s infinite ease-in-out;
        }

        @keyframes caveBreathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        #inputArea {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(74, 93, 82, 0.6);
            color: var(--text-color);
            font-size: 1.2rem;
            width: 80%;
            max-width: 400px;
            padding: 15px;
            text-align: center;
            outline: none;
        }

        #btn {
            margin-top: 35px;
            background: #19261f;
            border: 1px solid #3d4d43;
            color: var(--text-color);
            padding: 14px 32px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 2;
        }

        .hint {
            position: absolute;
            top: 40px;
            width: 85%;
            text-align: center;
            color: var(--hint-color);
            font-size: 0.95rem;
            pointer-events: none;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .ripple {
            position: absolute;
            border: 1px solid rgba(238, 220, 130, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleEffect 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 2;
        }

        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 180px; height: 180px; opacity: 0; }
        }

        /* --- 2. 病友夜燈 --- */
        .light {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: rgba(255, 221, 103, 0.25);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-color);
            cursor: pointer;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        .light.active {
            background: #ffdd67;
            box-shadow: 0 0 15px #ffdd67, 0 0 35px #ffdd67;
            animation: pulseGlimmer 2s infinite ease-in-out;
        }

        @keyframes pulseGlimmer {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        /* --- 3. 孤燈星空大畫面 --- */
        .lonely-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .light-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffdf85;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffdf85;
            animation: breathe 3s infinite ease-in-out;
            transition: all 0.5s ease;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; box-shadow: 0 0 5px #ffdf85; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; box-shadow: 0 0 18px #ffc107; transform: translate(-50%, -50%) scale(1.2); }
        }

        .light-dot.ignited {
            background-color: #ffffff;
            box-shadow: 0 0 30px #ffffff, 0 0 60px #ffeb3b;
            transform: translate(-50%, -50%) scale(2);
            animation: none;
        }

        /* --- 底部導航欄 --- */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(10, 15, 12, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            color: var(--hint-color);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 10px 0;
            transition: color 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- 🌌 頁面 1：釋放樹洞 -->
    <div id="cave-page" class="page active">
        <div class="hint">你已進入釋放樹洞，寫低心底感受，一按這裏就釋放了，電腦不會儲存，一切隨風沙消逝。</div>
        <div class="cave-container">
            <div class="cave-hole"></div>
            <input type="text" id="inputArea" placeholder="輸入你想說的話...">
        </div>
        <button id="btn">釋放樹洞</button>
    </div>

    <!-- 🌌 頁面 2：孤燈 -->
    <div id="lonely-page" class="page">
        <div class="hint">你進入了孤燈星空。畫面的燈火數量代表目前在線的病友總數。<br>點擊對方的微光，在孤獨中送上一點明亮。</div>
        <div id="lonely-lights-container" class="lonely-container"></div>
    </div>

    <!-- 🌌 頁面 3：病友夜燈 -->
    <div id="light-page" class="page">
        <div class="hint">深夜的星空下，有人正與你默默作伴。<br>點擊微光，為彼此送上一聲無聲的問候。</div>
        <div id="ward-lights-container" style="position:relative; width:100%; height:100%;"></div>
    </div>

    <!-- 🧭 底部導航欄 -->
    <div class="nav-bar">
        <div id="nav-cave" class="nav-item active" onclick="switchPage('cave-page', 'nav-cave')">🪐 釋放樹洞</div>
        <div id="nav-lonely" class="nav-item" onclick="switchPage('lonely-page', 'nav-lonely')">🕯️ 孤燈房</div>
        <div id="nav-light" class="nav-item" onclick="switchPage('light-page', 'nav-light')">🌌 病友夜燈</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(window.location.origin);
        let lightElements = {}; 

        // 🔄 修正後的導航切換：精準對齊個別按鈕，絕不卡死
        function switchPage(pageId, navId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            document.getElementById(navId).classList.add('active');
        }

        // 🎨 漣漪動畫
        function sendRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            document.body.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        }

        // 🪵 釋放樹洞按鈕點擊效果
        document.getElementById('btn').addEventListener('click', () => {
            const input = document.getElementById('inputArea');
            if(input.value.trim() !== "") {
                alert("文字已隨風沙釋放，一切隨風消逝...");
                input.value = ""; // 清空輸入框
            }
        });

        // ===================================================
        // 🌌 功能一：【病友夜燈】
        // ===================================================
        const wardContainer = document.getElementById('ward-lights-container');

        socket.on('init-ward-status', (wardLights) => {
            wardContainer.innerHTML = '';
            Object.values(wardLights).forEach(lightData => {
                const lightDiv = document.createElement('div');
                lightDiv.className = `light ${lightData.isOn ? 'active' : ''}`;
                lightDiv.id = `light-${lightData.id}`;
                lightDiv.style.left = `${lightData.x}%`;
                lightDiv.style.top = `${lightData.y}%`;

                lightDiv.addEventListener('click', (e) => {
                    sendRipple(e.clientX, e.clientY);
                    socket.emit('toggle-light', lightData.id);
                });
                wardContainer.appendChild(lightDiv);
            });
        });

        socket.on('sync-ward-light', (lightData) => {
            const el = document.getElementById(`light-${lightData.id}`);
            if (el) {
                if (lightData.isOn) el.classList.add('active');
                else el.classList.remove('active');
            }
        });

        socket.on('receive-companion-ripple', (data) => {
请谨慎使用此类代码。
const targetLight = document.getElementById(light-${data.lightId});
if (targetLight) {
const rect = targetLight.getBoundingClientRect();
sendRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
}
});
// ===================================================
// 🕯️ 功能二：【動態孤燈】
// ===================================================
const lonelyContainer = document.getElementById('lonely-lights-container');
socket.on('update_lights', (lightsArray) => {
lonelyContainer.innerHTML = '';
lightElements = {};
lightsArray.forEach(light => {
const dot = document.createElement('div');
dot.className = 'light-dot';
dot.style.left = ${light.x}%;
dot.style.top = ${light.y}%;
if (light.id === socket.id) {
dot.style.backgroundColor = '#a8ffb2';
dot.style.boxShadow = '0 0 15px #a8ffb2';
}
dot.addEventListener('click', (e) => {
sendRipple(e.clientX, e.clientY);
if (light.id !== socket.id) {
socket.emit('click_light', { targetId: light.id });
}
});
lonelyContainer.appendChild(dot);
lightElements[light.id] = dot;
});
});
socket.on('light_triggered', (data) => {
const { fromId, targetId } = data;
[fromId, targetId].forEach(id => {
const el = lightElements[id];
if (el) {
el.classList.add('ignited');
const rect = el.getBoundingClientRect();
sendRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
setTimeout(() => { el.classList.remove('ignited'); }, 1500);
}
});
});
