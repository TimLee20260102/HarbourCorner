<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微光 - Glimmer</title>
    <style>
        :root {
            --bg-color: #0d1310;
            --bg-color-alt: #110e16;
            --text-color: #D1C7BD;
            --hint-color: #8C827A;
            --accent-color: #EEDC82;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            transition: background-color 0.5s ease;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 70px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .page.active {
            display: flex;
        }

        /* --- 1. 釋放樹洞 --- */
        .cave-container {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .cave-hole {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.9) 0%, rgba(13, 19, 16, 0.5) 50%, rgba(13, 19, 16, 0) 70%);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 1), 0 0 30px rgba(74, 93, 82, 0.2);
            z-index: -1;
            animation: caveBreathe 6s infinite ease-in-out, caveRotate 20s infinite linear;
        }

        @keyframes caveBreathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
                box-shadow: inset 0 0 50px rgba(0, 0, 0, 1), 0 0 45px rgba(74, 93, 82, 0.3);
            }
        }

        @keyframes caveRotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #inputArea {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(74, 93, 82, 0.6);
            color: var(--text-color);
            font-size: 1.2rem;
            width: 80%;
            max-width: 400px;
            padding: 15px;
            text-align: center;
            outline: none;
        }

        #btn {
            margin-top: 35px;
            background: #19261f;
            border: 1px solid #3d4d43;
            color: var(--text-color);
            padding: 14px 32px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        /* --- 通用：提示與漣漪 --- */
        .hint {
            position: absolute;
            top: 40px;
            width: 85%;
            text-align: center;
            color: var(--hint-color);
            font-size: 0.95rem;
            pointer-events: none;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .ripple,
        .light-ripple {
            position: absolute;
            border: 1px solid rgba(238, 220, 130, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleEffect 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 2;
        }

        .sand-canvas {
            position: fixed;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                width: 180px;
                height: 180px;
                opacity: 0;
            }
        }

        /* --- 2. 病友夜燈 --- */
        .light {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: rgba(255, 221, 103, 0.25);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-color);
            cursor: pointer;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        .light.active {
            background: #ffdd67;
            box-shadow: 0 0 15px #ffdd67, 0 0 35px #ffdd67;
            animation: pulseGlimmer 2s infinite ease-in-out;
        }

        @keyframes pulseGlimmer {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.7;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        /* --- 3. 孤燈獨立星空大畫面 --- */
        .lonely-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .light-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffdf85;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffdf85;
            animation: breathe 3s infinite ease-in-out;
            transition: all 0.5s ease;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.4;
                box-shadow: 0 0 5px #ffdf85;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 18px #ffc107;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        .light-dot.ignited {
            background-color: #ffffff;
            box-shadow: 0 0 30px #ffffff, 0 0 60px #ffeb3b;
            transform: translate(-50%, -50%) scale(2);
            animation: none;
        }

        .light-dot.residual {
            background-color: #f3a96d;
            box-shadow: 0 0 calc(10px * var(--light-brightness, 0.45)) #f3a96d,
                0 0 calc(20px * var(--light-brightness, 0.45)) rgba(243, 169, 109, 0.45);
            opacity: calc(0.35 + var(--light-brightness, 0.45) * 0.2);
            animation: residualBreathe 4s infinite ease-in-out;
        }

        @keyframes residualBreathe {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.85);
            }

            50% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .light-caption {
            position: absolute;
            top: 16px;
            left: 50%;
            width: max-content;
            max-width: 180px;
            color: #e8b58c;
            font-size: 10px;
            line-height: 1.4;
            text-align: center;
            transform: translateX(-50%);
            pointer-events: none;
            text-shadow: 0 0 8px rgba(243, 169, 109, 0.35);
        }

        .light-jar {
            position: absolute;
            top: 92px;
            z-index: 4;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            border: 1px solid rgba(238, 220, 130, 0.28);
            border-radius: 24px;
            background: rgba(25, 30, 25, 0.76);
            color: #e6d9aa;
            box-shadow: 0 0 18px rgba(238, 220, 130, 0.08);
            font: inherit;
            cursor: pointer;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .light-jar:hover {
            background: rgba(43, 42, 31, 0.9);
            box-shadow: 0 0 22px rgba(238, 220, 130, 0.18);
        }

        .light-jar-count {
            min-width: 1.5em;
            color: var(--accent-color);
            font-weight: 600;
            text-align: center;
        }

        .companion-toast {
            position: fixed;
            z-index: 20;
            top: 24px;
            left: 50%;
            max-width: calc(100vw - 40px);
            padding: 12px 18px;
            border: 1px solid rgba(238, 220, 130, 0.24);
            border-radius: 22px;
            background: rgba(24, 29, 24, 0.94);
            color: #e6d9aa;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(238, 220, 130, 0.12);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .companion-toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .flying-glow {
            position: fixed;
            z-index: 19;
            color: #ffdf85;
            font-size: 22px;
            pointer-events: none;
            filter: drop-shadow(0 0 8px #ffdf85);
        }

        /* --- 底部導航欄 --- */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(10, 15, 12, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            color: var(--hint-color);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 10px 0;
            transition: color 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- 🌌 頁面 1：釋放樹洞 -->
    <div id="cave-page" class="page active">
        <div class="hint">你已進入釋放樹洞，寫低心底感受，一按這裏就釋放了，電腦不會儲存，一切隨風沙消逝。</div>
        <div class="cave-container">
            <div class="cave-hole"></div>
            <input type="text" id="inputArea" placeholder="輸入你想說的話...">
        </div>
        <button id="btn">釋放樹洞</button>
    </div>

    <!-- 🌌 頁面 2：孤燈 (新功能大畫面) -->
    <div id="lonely-page" class="page">
        <div class="hint">你進入了孤燈星空。畫面的燈火數量代表目前在線的病友總數。<br>點擊對方的微光，在孤獨中送上一點明亮。</div>
        <button id="light-jar" class="light-jar" type="button" aria-label="存入一縷微光">
            <span>✨ 星光儲蓄罐</span>
            <span id="light-jar-count" class="light-jar-count" aria-live="polite">0</span>
        </button>
        <div id="lonely-lights-container" class="lonely-container"></div>
    </div>

    <!-- 🌌 頁面 3：病友夜燈 -->
    <div id="light-page" class="page">
        <div class="hint">深夜的星空下，有人正與你默默作伴。<br>點擊微光，為彼此送上一聲無聲的問候。</div>
        <!-- 6 盞固定夜燈容器 -->
        <div id="ward-lights-container" style="position:relative; width:100%; height:100%;"></div>
    </div>

    <!-- 🧭 底部導航欄 -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('cave-page')">🪐 釋放樹洞</div>
        <div class="nav-item" onclick="switchPage('lonely-page')">🕯️ 孤燈房</div>
        <div class="nav-item" onclick="switchPage('light-page')">🌌 病友夜燈</div>
    </div>
    <div id="companion-toast" class="companion-toast" role="status" aria-live="polite"></div>

    <!-- 📡 引入 Socket.io 與核心腳本 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 自動識別 Render 或本地網址連線
        const socket = io(window.location.origin);

        let lightElements = {}; // 暫存孤燈 DOM 節點
        let toastTimer;

        // 🔄 1. 頁面切換控制
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');

            // 讓對應的導航按鈕高亮
            if (pageId === 'cave-page') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if (pageId === 'lonely-page') document.querySelectorAll('.nav-item')[1].classList.add('active');
            if (pageId === 'light-page') document.querySelectorAll('.nav-item')[2].classList.add('active');
        }

        // 🎨 2. 特效輔助函數：本地點擊漣漪
        function sendRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            document.body.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        }

        function releaseAsSand(input) {
            const text = input.value;
            const rect = input.getBoundingClientRect();
            const style = getComputedStyle(input);
            const dpr = window.devicePixelRatio || 1;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            if (!context) return;

            canvas.className = 'sand-canvas';
            canvas.style.left = `${rect.left}px`;
            canvas.style.top = `${rect.top}px`;
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            canvas.width = Math.ceil(rect.width * dpr);
            canvas.height = Math.ceil(rect.height * dpr);
            context.scale(dpr, dpr);
            context.font = style.font;
            context.fillStyle = style.color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, rect.width / 2, rect.height / 2);

            const image = context.getImageData(0, 0, canvas.width, canvas.height);
            const stride = 4;
            const particles = [];

            for (let y = 0; y < canvas.height; y += stride) {
                for (let x = 0; x < canvas.width; x += stride) {
                    if (image.data[(y * canvas.width + x) * 4 + 3] > 100) {
                        particles.push({
                            x: x / dpr,
                            y: y / dpr,
                            vx: (Math.random() - 0.5) * 0.8,
                            vy: Math.random() * 0.35 + 0.1,
                            drift: (Math.random() - 0.5) * 0.3,
                            delay: Math.random() * 350,
                            size: Math.random() * 1.5 + 0.6
                        });
                    }
                }
            }

            if (!particles.length) return;

            document.body.appendChild(canvas);
            const startedAt = performance.now();
            const duration = 2200;

            function animate(now) {
                const elapsed = now - startedAt;
                context.clearRect(0, 0, rect.width, rect.height);

                particles.forEach(particle => {
                    const age = elapsed - particle.delay;
                    if (age < 0) {
                        context.globalAlpha = 1;
                        context.fillStyle = style.color;
                        context.fillRect(particle.x, particle.y, particle.size, particle.size);
                        return;
                    }

                    const progress = Math.min(age / (duration - particle.delay), 1);
                    context.globalAlpha = 1 - progress;
                    context.fillStyle = '#d8c49a';
                    context.fillRect(
                        particle.x + particle.vx * age / 16.67 + particle.drift * age / 35,
                        particle.y + particle.vy * age / 16.67 + 0.025 * age / 16.67,
                        particle.size,
                        particle.size
                    );
                });

                context.globalAlpha = 1;
                if (elapsed < duration) {
                    requestAnimationFrame(animate);
                } else {
                    canvas.remove();
                }
            }

            requestAnimationFrame(animate);
        }

        document.getElementById('btn').addEventListener('click', () => {
            const input = document.getElementById('inputArea');
            if (!input.value.trim()) return;
            const cave = document.querySelector('.cave-container').getBoundingClientRect();
            sendRipple(cave.left + cave.width / 2, cave.top + cave.height / 2);
            releaseAsSand(input);
            input.value = '';
        });

        // ===================================================
        // 🌌 功能一：【固定病房夜燈】前端邏輯
        // ===================================================
        const wardContainer = document.getElementById('ward-lights-container');

        // 初始化渲染 6 盞燈
        socket.on('init-ward-status', (wardLights) => {
            wardContainer.innerHTML = '';
            Object.values(wardLights).forEach(lightData => {
                const lightDiv = document.createElement('div');
                lightDiv.className = `light ${lightData.isOn ? 'active' : ''}`;
                lightDiv.id = `light-${lightData.id}`;
                lightDiv.style.left = `${lightData.x}%`;
                lightDiv.style.top = `${lightData.y}%`;

                lightDiv.addEventListener('click', (e) => {
                    sendRipple(e.clientX, e.clientY);
                    socket.emit('toggle-light', lightData.id);
                });
                wardContainer.appendChild(lightDiv);
            });
        });

        socket.on('sync-ward-light', (lightData) => {
            const el = document.getElementById(`light-${lightData.id}`);
            if (el) el.classList.toggle('active', lightData.isOn);
        });

        socket.on('receive-companion-ripple', (data) => {
            const targetLight = document.getElementById(`light-${data.lightId}`);
            if (targetLight) {
                const rect = targetLight.getBoundingClientRect();
                sendRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
            }
        });

        const lonelyContainer = document.getElementById('lonely-lights-container');
        socket.on('update_lights', (lightsArray) => {
            lonelyContainer.innerHTML = '';
            lightElements = {};
            lightsArray.forEach(light => {
                const dot = document.createElement('div');
                dot.className = `light-dot${light.status === 'residual' ? ' residual' : ''}`;
                dot.style.left = `${light.x}%`;
                dot.style.top = `${light.y}%`;
                dot.style.setProperty('--light-brightness', light.brightness || 0.45);

                if (light.status !== 'residual' && light.id === socket.id) {
                    dot.style.backgroundColor = '#a8ffb2';
                    dot.style.boxShadow = '0 0 15px #a8ffb2';
                }

                if (light.status === 'residual') {
                    dot.title = `已收到 ${light.encouragementCount || 0} 次鼓勵`;
                    const caption = document.createElement('span');
                    caption.className = 'light-caption';
                    caption.textContent = `有位同路人剛來過 · 鼓勵 ${light.encouragementCount || 0}`;
                    dot.appendChild(caption);
                }

                dot.addEventListener('click', (e) => {
                    sendRipple(e.clientX, e.clientY);
                    if (light.id !== socket.id) {
                        socket.emit('click_light', { targetId: light.id });
                    }
                });
                lonelyContainer.appendChild(dot);
                lightElements[light.id] = dot;
            });
        });

        document.getElementById('light-jar').addEventListener('click', () => {
            socket.emit('deposit-light');
        });

        socket.on('light-jar-state', ({ count }) => {
            document.getElementById('light-jar-count').textContent = count;
        });

        function showCompanionToast(message) {
            const toast = document.getElementById('companion-toast');
            toast.textContent = message;
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 5000);
        }

        socket.on('solo-light-boost', ({ targetId }) => {
            if (targetId !== socket.id) return;

            const jarButton = document.getElementById('light-jar');
            const target = lightElements[targetId];
            const jarRect = jarButton.getBoundingClientRect();
            const targetRect = target && target.getBoundingClientRect();

            if (target && document.getElementById('lonely-page').classList.contains('active')) {
                const glow = document.createElement('span');
                glow.className = 'flying-glow';
                glow.textContent = '✦';
                glow.style.left = `${jarRect.left + jarRect.width / 2}px`;
                glow.style.top = `${jarRect.top + jarRect.height / 2}px`;
                document.body.appendChild(glow);

                const deltaX = targetRect.left + targetRect.width / 2 - jarRect.left - jarRect.width / 2;
                const deltaY = targetRect.top + targetRect.height / 2 - jarRect.top - jarRect.height / 2;
                const animation = glow.animate([
                    { transform: 'translate(-50%, -50%) scale(0.7)', opacity: 0.2 },
                    { transform: 'translate(-50%, -50%) scale(1.3)', opacity: 1, offset: 0.35 },
                    { transform: `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px)) scale(0.6)`, opacity: 0.2 }
                ], { duration: 1300, easing: 'ease-in-out' });
                animation.addEventListener('finish', () => glow.remove(), { once: true });
                target.classList.add('ignited');
                setTimeout(() => target.classList.remove('ignited'), 1500);
            }

            showCompanionToast('大家白天存下的微光，正在替他們陪伴你');
        });

        socket.on('light_triggered', (data) => {
            const { fromId, targetId } = data;
            [fromId, targetId].forEach(id => {
                const el = lightElements[id];
                if (el) {
                    el.classList.add('ignited');
                    const rect = el.getBoundingClientRect();
                    sendRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
                    setTimeout(() => el.classList.remove('ignited'), 1500);
                }
            });
        });

            
            
    </script>
</body>

</html>
