<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微光｜港灣角落</title>
    <style>
        :root {
            --bg-color: #0d1310;
            --bg-color-alt: #110e16;
            --text-color: #D1C7BD;
            --hint-color: #8C827A;
            --accent-color: #EEDC82;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            transition: background-color 0.5s ease;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 70px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .page.active {
            display: flex;
        }

        /* --- 1. 釋放樹洞 --- */
        .cave-container {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .cave-hole {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.9) 0%, rgba(13, 19, 16, 0.5) 50%, rgba(13, 19, 16, 0) 70%);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 1), 0 0 30px rgba(74, 93, 82, 0.2);
            z-index: -1;
            animation: caveBreathe 6s infinite ease-in-out, caveRotate 20s infinite linear;
        }

        @keyframes caveBreathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
                box-shadow: inset 0 0 50px rgba(0, 0, 0, 1), 0 0 45px rgba(74, 93, 82, 0.3);
            }
        }

        @keyframes caveRotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #inputArea {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(74, 93, 82, 0.6);
            color: var(--text-color);
            font-size: 1.2rem;
            width: 80%;
            max-width: 400px;
            padding: 15px;
            text-align: center;
            outline: none;
        }

        #btn {
            margin-top: 35px;
            background: #19261f;
            border: 1px solid #3d4d43;
            color: var(--text-color);
            padding: 14px 32px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        /* --- 通用：提示與漣漪 --- */
        .hint {
            position: absolute;
            top: 40px;
            width: 85%;
            text-align: center;
            color: var(--hint-color);
            font-size: 0.95rem;
            pointer-events: none;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .page > .hint {
            top: 88px;
        }

        .ripple,
        .light-ripple {
            position: absolute;
            border: 1px solid rgba(238, 220, 130, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleEffect 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 2;
        }

        .sand-canvas {
            position: fixed;
            inset: 0;
            z-index: 3;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .release-message {
            position: fixed;
            z-index: 6;
            top: 50%;
            left: 50%;
            width: max-content;
            max-width: calc(100vw - 40px);
            color: rgba(232, 220, 190, 0.72);
            font-size: 0.95rem;
            line-height: 1.6;
            text-align: center;
            text-shadow: 0 0 18px rgba(238, 220, 130, 0.24);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.9s ease;
        }

        .release-message.visible {
            opacity: 1;
        }

        .cave-container.is-releasing #inputArea,
        .cave-container.is-releasing + #btn {
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                width: 180px;
                height: 180px;
                opacity: 0;
            }
        }

        /* --- 孤燈房星空 --- */
        .lonely-container {
            position: relative;
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
        }

        #lonely-page {
            justify-content: flex-start;
        }

        .lonely-header {
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 1.3vh, 10px);
            width: 100%;
            box-sizing: border-box;
            padding: clamp(10px, 2.4vh, 20px) 16px 8px;
        }

        .glimmer-guide {
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #d7d0c8;
            font-size: 0.84rem;
            line-height: 1.4;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.35s ease,
                padding 0.35s ease, border-color 0.35s ease, margin 0.35s ease;
            max-height: 300px;
            overflow: hidden;
        }

        .glimmer-guide.is-hidden {
            max-height: 0;
            margin-bottom: -16px;
            padding-top: 0;
            padding-bottom: 0;
            border-color: transparent;
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
        }

        .glimmer-guide p {
            margin: 0;
        }

        .glimmer-guide ul {
            margin: 4px 0 0;
            padding-left: 1.25em;
        }

        .glimmer-guide li + li {
            margin-top: 2px;
        }

        .glimmer-guide strong {
            color: #ead9ad;
            font-weight: 600;
        }

        .glimmer-guide-dismiss {
            display: block;
            margin: 5px 0 0 auto;
            padding: 2px 0 0 8px;
            border: 0;
            background: transparent;
            color: #a99f92;
            font: inherit;
            font-size: 0.82rem;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.25s ease;
        }

        .glimmer-guide-dismiss:hover,
        .glimmer-guide-dismiss:focus-visible {
            color: #e6d9aa;
        }

        .light-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffdf85;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffdf85;
            animation: breathe 3s infinite ease-in-out;
            transition: all 0.5s ease;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.4;
                box-shadow: 0 0 5px #ffdf85;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 18px #ffc107;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        .light-dot.ignited {
            background-color: #ffffff;
            box-shadow: 0 0 30px #ffffff, 0 0 60px #ffeb3b;
            transform: translate(-50%, -50%) scale(2);
            animation: none;
        }

        .light-dot.residual {
            background-color: #f3a96d;
            box-shadow: 0 0 calc(10px * var(--light-brightness, 0.45)) #f3a96d,
                0 0 calc(20px * var(--light-brightness, 0.45)) rgba(243, 169, 109, 0.45);
            opacity: calc(0.35 + var(--light-brightness, 0.45) * 0.2);
            animation: residualBreathe 4s infinite ease-in-out;
        }

        .light-dot.blessed::after {
            content: "";
            position: absolute;
            inset: -9px;
            border: 1px solid rgba(255, 220, 132, 0.72);
            border-radius: 50%;
            box-shadow: 0 0 13px rgba(255, 211, 105, 0.52),
                0 0 24px rgba(255, 211, 105, 0.24);
            pointer-events: none;
            animation: blessingGlow 3s infinite ease-in-out;
        }

        @keyframes blessingGlow {
            0%,
            100% {
                opacity: 0.58;
                transform: scale(0.96);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes residualBreathe {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.85);
            }

            50% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .light-caption {
            position: absolute;
            top: 16px;
            left: 50%;
            width: max-content;
            max-width: min(180px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: #e8b58c;
            font-size: 10px;
            line-height: 1.4;
            text-align: center;
            transform: translateX(-50%);
            pointer-events: none;
            text-shadow: 0 0 8px rgba(243, 169, 109, 0.35);
        }

        .light-jar {
            z-index: 4;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid rgba(238, 220, 130, 0.28);
            border-radius: 24px;
            background: rgba(25, 30, 25, 0.76);
            color: #e6d9aa;
            box-shadow: 0 0 18px rgba(238, 220, 130, 0.08);
            font: inherit;
            cursor: pointer;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        html[lang="en"] .glimmer-guide {
            padding: 7px 10px;
            font-size: 0.72rem;
            line-height: 1.2;
        }

        html[lang="en"] .glimmer-guide ul {
            margin-top: 3px;
        }

        html[lang="en"] .glimmer-guide-dismiss {
            margin-top: 2px;
            font-size: 0.7rem;
        }

        @media (max-width: 560px) {
            #lonely-page .lonely-header {
                padding-top: 62px;
            }

            .glimmer-guide {
                padding: 8px 10px;
                font-size: 0.72rem;
                line-height: 1.2;
            }

            .glimmer-guide ul {
                margin-top: 3px;
            }

            .glimmer-guide li + li {
                margin-top: 1px;
            }

            .glimmer-guide-dismiss {
                margin-top: 3px;
            }
        }

        .light-jar:hover {
            background: rgba(43, 42, 31, 0.9);
            box-shadow: 0 0 22px rgba(238, 220, 130, 0.18);
        }

        .light-jar-count {
            min-width: 1.5em;
            color: var(--accent-color);
            font-weight: 600;
            text-align: center;
        }

        .companion-toast {
            position: fixed;
            z-index: 20;
            top: 24px;
            left: 50%;
            max-width: calc(100vw - 40px);
            padding: 12px 18px;
            border: 1px solid rgba(238, 220, 130, 0.24);
            border-radius: 22px;
            background: rgba(24, 29, 24, 0.94);
            color: #e6d9aa;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(238, 220, 130, 0.12);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -8px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }

        .companion-toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .flying-glow {
            position: fixed;
            z-index: 19;
            color: #ffdf85;
            font-size: 22px;
            pointer-events: none;
            filter: drop-shadow(0 0 8px #ffdf85) drop-shadow(0 0 18px rgba(255, 208, 103, 0.8));
        }

        .flying-glow::before {
            content: "";
            position: absolute;
            top: 50%;
            right: 50%;
            width: 58px;
            height: 3px;
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, rgba(255, 213, 122, 0.1), #ffe6a1);
            filter: blur(1.5px);
            opacity: 0.8;
            transform: rotate(var(--trail-angle, 0deg));
            transform-origin: right center;
        }

        .gift-ripple {
            position: fixed;
            z-index: 18;
            width: 0;
            height: 0;
            border: 1px solid rgba(255, 220, 132, 0.78);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 14px rgba(255, 211, 105, 0.42),
                inset 0 0 12px rgba(255, 211, 105, 0.16);
            transform: translate(-50%, -50%);
            animation: giftRippleEffect 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes giftRippleEffect {
            from {
                width: 0;
                height: 0;
                opacity: 0.95;
            }

            to {
                width: 140px;
                height: 140px;
                opacity: 0;
            }
        }

        /* --- 底部導航欄 --- */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(10, 15, 12, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: stretch;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 10;
        }

        .nav-item {
            flex: 1 1 0;
            min-width: 0;
            text-align: center;
            color: var(--hint-color);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 8px 4px;
            line-height: 1.25;
            overflow-wrap: anywhere;
            background: transparent;
            border: 0;
            font-family: inherit;
            transition: color 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .language-switcher {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(15, 20, 17, 0.58);
            backdrop-filter: blur(10px);
        }

        .language-switcher button {
            min-width: 34px;
            padding: 6px 8px;
            border: 0;
            border-radius: 16px;
            background: transparent;
            color: var(--hint-color);
            font: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .language-switcher button[aria-pressed="true"] {
            background: rgba(238, 220, 130, 0.16);
            color: var(--accent-color);
        }

        .language-switcher button:focus-visible {
            outline: 1px solid var(--accent-color);
            outline-offset: 2px;
        }

        .top-controls {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sound-toggle {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            background: rgba(15, 20, 17, 0.58);
            color: var(--text-color);
            font: inherit;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.25s ease, color 0.25s ease;
        }

        .sound-toggle[aria-pressed="true"] {
            border-color: rgba(238, 220, 130, 0.28);
            color: var(--accent-color);
            background: rgba(238, 220, 130, 0.12);
        }

        .sound-toggle:focus-visible {
            outline: 1px solid var(--accent-color);
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <div class="top-controls">
        <button id="sound-toggle" class="sound-toggle" type="button" aria-label="開啟微音陪伴" aria-pressed="false">
            <span id="sound-toggle-icon" aria-hidden="true">🔇</span>
        </button>
        <div class="language-switcher" role="group" aria-label="選擇語言" data-i18n-aria-label="languageSelector">
            <button type="button" data-language="zh-Hant" aria-label="繁體中文" data-i18n-aria-label="traditionalChinese" aria-pressed="true">繁</button>
            <button type="button" data-language="zh-Hans" aria-label="简体中文" data-i18n-aria-label="simplifiedChinese" aria-pressed="false">简</button>
            <button type="button" data-language="en" aria-label="English" data-i18n-aria-label="english" aria-pressed="false">EN</button>
        </div>
    </div>

    <!-- 🌌 孤燈房：在線微光與星光儲蓄罐 -->
    <div id="lonely-page" class="page active">
        <div class="lonely-header">
            <section id="glimmer-guide" class="glimmer-guide" aria-label="孤燈房使用說明" data-i18n-aria-label="guideLabel">
                <p data-i18n="guideIntro"></p>
                <ul>
                    <li data-i18n="guideSelf"></li>
                    <li data-i18n="guideCompanions"></li>
                    <li data-i18n="guideJar"></li>
                </ul>
                <button id="glimmer-guide-dismiss" class="glimmer-guide-dismiss" type="button" data-i18n="guideDismiss"></button>
            </section>
            <button id="light-jar" class="light-jar" type="button" aria-label="存入一縷微光" data-i18n-aria-label="jarAction">
                <span data-i18n="jarAction"></span>
                <span id="light-jar-count" class="light-jar-count" aria-live="polite">0</span>
            </button>
        </div>
        <div id="lonely-lights-container" class="lonely-container"></div>
    </div>

    <!-- 🌌 釋放樹洞 -->
    <div id="cave-page" class="page">
        <div class="hint" data-i18n="caveHint"></div>
        <div class="cave-container">
            <div class="cave-hole"></div>
            <input type="text" id="inputArea" autocomplete="off" autocorrect="off" spellcheck="false" data-i18n-placeholder="cavePlaceholder" placeholder="輸入你想說的話...">
        </div>
        <button id="btn" type="button" data-i18n="releaseButton"></button>
    </div>

    <!-- 🧭 底部導航欄 -->
    <div class="nav-bar">
        <button class="nav-item active" type="button" onclick="switchPage('lonely-page')" data-i18n="navLanterns"></button>
        <button class="nav-item" type="button" onclick="switchPage('cave-page')" data-i18n="navHollow"></button>
    </div>
    <div id="companion-toast" class="companion-toast" role="status" aria-live="polite"></div>
    <div id="release-message" class="release-message" role="status" aria-live="polite" aria-hidden="true" data-i18n="releaseMessage"></div>

    <!-- 📡 引入 Socket.io 與核心腳本 -->

                guideJar: '<strong>存入微光：</strong>把祝福存进星光瓶；深夜只剩一人时，微光会自动飞向他作伴。',
                guideDismiss: '我已经熟悉了，不用提醒',
                jarAction: '✨ 存入微光',
                navHollow: '🪐 释放树洞',
                navLanterns: '🕯️ 孤灯房',
                residualTitle: '已收到 {count} 次鼓励',
                residualCaption: '有位同行者刚来过 · 鼓励 {count}',
                soloToast: '✨ 大家白天存下的微光，正化作暖意陪着你'
            },
            en: {
                documentTitle: 'Harbour Corner — A little light for the night',
                languageSelector: 'Choose a language',
                traditionalChinese: 'Traditional Chinese',
                simplifiedChinese: 'Simplified Chinese',
                english: 'English',
                soundMuted: 'Turn on gentle sounds',
                soundEnabled: 'Turn off gentle sounds',
                caveHint: 'Welcome to the Whispering Hollow. Leave what is on your heart, then let it dissolve into the wind. Your words are never saved here.',
                cavePlaceholder: 'Leave a few words here…',
                releaseButton: 'Whispering Hollow',
                releaseMessage: 'Your words are dissolving into stardust. May peace find you tonight...',
                guideLabel: 'A guide to Solitary Lanterns',
                guideIntro: "Harbour Corner is 100% anonymous—no one knows who's here. If you're lonely, tired or unwell, someone out there cares.",
                guideSelf: '<strong>Your green, breathing light</strong> is you.',
                guideCompanions: '<strong>Other bright lights</strong> are online companions. Tap to send silent encouragement with a ripple and gentle vibration. Amber afterglows last 4 hours; tap to warm one.',
                guideJar: '<strong>Add a glimmer</strong> to the Starlight Jar. When someone is alone at night, a blessing flies to keep them company.',
                guideDismiss: 'I know my way around — no more reminders',
                jarAction: '✨ Add a Glimmer',
                navHollow: '🪐 Whispering Hollow',
                navLanterns: '🕯️ Solitary Lanterns',
                residualTitle: 'Warmth shared: {count}',
                residualCaption: 'A companion was just here · Warmth {count}',
                soloToast: '✨ A glimmer saved earlier has found you, keeping you company'
            }
        };

        function detectLanguage() {
            const savedLanguage = localStorage.getItem('harbourCornerLanguage');
            if (Object.prototype.hasOwnProperty.call(translations, savedLanguage)) return savedLanguage;

            const browserLanguage = (navigator.language || '').toLowerCase();
            if (browserLanguage.startsWith('zh-tw') || browserLanguage.startsWith('zh-hk')) return 'zh-Hant';
            if (browserLanguage.startsWith('zh-cn') || browserLanguage.startsWith('zh-sg')) return 'zh-Hans';
            return 'en';
        }

        let currentLanguage = detectLanguage();
        let lightElements = {};
        let hasReceivedSoloGift = false;
        let activeToastKey = null;
        let toastTimer;
        let soundEnabled = localStorage.getItem('hc_sound_enabled') === 'true';
        let audioContext = null;

        function updateSoundToggle() {
            const button = document.getElementById('sound-toggle');
            button.setAttribute('aria-pressed', String(soundEnabled));
            button.setAttribute('aria-label', translate(soundEnabled ? 'soundEnabled' : 'soundMuted'));
            document.getElementById('sound-toggle-icon').textContent = soundEnabled ? '🔉' : '🔇';
        }

        function getAudioContext() {
            if (audioContext) return audioContext;

            const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextConstructor) return null;

            try {
                audioContext = new AudioContextConstructor();
                return audioContext;
            } catch {
                return null;
            }
        }

        function playGentleChime() {
            if (!soundEnabled) return;

            const context = getAudioContext();
            if (!context) return;

            const play = () => {
                const now = context.currentTime;
                [
                    { frequency: 660, volume: 0.035 },
                    { frequency: 990, volume: 0.012 }
                ].forEach(({ frequency, volume }) => {
                    const oscillator = context.createOscillator();
                    const gain = context.createGain();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(frequency, now);
                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.exponentialRampToValueAtTime(volume, now + 0.025);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
                    oscillator.connect(gain);
                    gain.connect(context.destination);
                    oscillator.start(now);
                    oscillator.stop(now + 0.95);
                });
            };

            if (context.state === 'running') {
                play();
            } else {
                context.resume().then(play).catch(() => {});
            }
        }

        function translate(key, values = {}) {
            return translations[currentLanguage][key].replace(/\{(\w+)\}/g, (_, name) => values[name] ?? '');
        }

        function updateDynamicLightLabels() {
            Object.values(lightElements).forEach((light) => {
                if (!light.classList.contains('residual')) return;
                const count = light.dataset.encouragementCount || '0';
                light.title = translate('residualTitle', { count });
                const caption = light.querySelector('.light-caption');
                if (caption) caption.textContent = translate('residualCaption', { count });
            });
        }

        function applyLanguage(language, persist = false) {
            currentLanguage = language;
            document.documentElement.lang = language;
            document.title = translate('documentTitle');

            document.querySelectorAll('[data-i18n]').forEach((element) => {
                element.innerHTML = translate(element.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((element) => {
                element.placeholder = translate(element.dataset.i18nPlaceholder);
            });
            document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
                element.setAttribute('aria-label', translate(element.dataset.i18nAriaLabel));
            });
            document.querySelectorAll('.language-switcher [data-language]').forEach((button) => {
                button.setAttribute('aria-pressed', String(button.dataset.language === language));
            });
            updateSoundToggle();

            updateDynamicLightLabels();
            if (activeToastKey) {
                document.getElementById('companion-toast').textContent = translate(activeToastKey);
            }
            if (persist) localStorage.setItem('harbourCornerLanguage', language);
        }

        document.querySelectorAll('.language-switcher [data-language]').forEach((button) => {
            button.addEventListener('click', () => applyLanguage(button.dataset.language, true));
        });

        document.getElementById('sound-toggle').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('hc_sound_enabled', String(soundEnabled));
            updateSoundToggle();

            if (soundEnabled) {
                const context = getAudioContext();
                if (context && context.state !== 'running') {
                    context.resume().catch(() => {});
                }
            }
        });

        applyLanguage(currentLanguage);

        const glimmerGuide = document.getElementById('glimmer-guide');
        if (localStorage.getItem('hideGlimmerGuide') === 'true') {
            glimmerGuide.classList.add('is-hidden');
        }

        document.getElementById('glimmer-guide-dismiss').addEventListener('click', () => {
            localStorage.setItem('hideGlimmerGuide', 'true');
            glimmerGuide.classList.add('is-hidden');
        });

        function createVisitorId() {
            if (typeof crypto.randomUUID === 'function') return `hc_${crypto.randomUUID()}`;

            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
            return `hc_${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
        }

        let visitorId = localStorage.getItem('hc_visitor_id');
        if (!visitorId) {
            visitorId = createVisitorId();
            localStorage.setItem('hc_visitor_id', visitorId);
        }

        // 自動識別 Render 或本地網址連線
        const socket = io(window.location.origin, {
            auth: { visitor_id: visitorId }
        });

        socket.on('disconnect', () => {
            hasReceivedSoloGift = false;
            const currentLight = lightElements[visitorId];
            if (currentLight) currentLight.classList.remove('blessed');
        });

        // 🔄 1. 頁面切換控制
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');

            // 讓對應的導航按鈕高亮
            if (pageId === 'lonely-page') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if (pageId === 'cave-page') document.querySelectorAll('.nav-item')[1].classList.add('active');
        }

        // 🎨 2. 特效輔助函數：本地點擊漣漪
        function sendRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            document.body.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        }

        function vibrate(pattern) {
            if (!('vibrate' in navigator) || typeof navigator.vibrate !== 'function') return;

            try {
                navigator.vibrate(pattern);
            } catch {
                // Vibration may be unavailable in restricted browser contexts.
            }
        }

        function primeHapticsOnFirstTap(event) {
            if (!event.isTrusted) return;
            vibrate(1);
            document.removeEventListener('click', primeHapticsOnFirstTap, true);
        }

        document.addEventListener('click', primeHapticsOnFirstTap, true);

        function releaseAsSand(input, onComplete) {
            const rect = input.getBoundingClientRect();
            const style = getComputedStyle(input);
            const dpr = window.devicePixelRatio || 1;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const sourceCanvas = document.createElement('canvas');
            const sourceContext = sourceCanvas.getContext('2d');
            if (!context || !sourceContext) return false;

            let text = input.value;
            if (!text.trim()) return false;
            input.value = '';

            sourceCanvas.width = Math.ceil(rect.width * dpr);
            sourceCanvas.height = Math.ceil(rect.height * dpr);
            sourceContext.scale(dpr, dpr);
            sourceContext.font = style.font;
            sourceContext.fillStyle = style.color;
            sourceContext.textAlign = 'center';
            sourceContext.textBaseline = 'middle';
            sourceContext.fillText(text, rect.width / 2, rect.height / 2, rect.width);
            text = '';

            const image = sourceContext.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            const stride = Math.max(3, Math.ceil(Math.sqrt((sourceCanvas.width * sourceCanvas.height) / 40000)));
            const particles = [];

            function createParticle(x, y) {
                return {
                    x,
                    y,
                    vx: Math.random() * 90 - 40,
                    vy: Math.random() * 50 - 78,
                    ax: Math.random() * 2.4 - 0.3,
                    ay: Math.random() * 0.8 - 0.4,
                    waveX: Math.random() * 18 + 4,
                    waveY: Math.random() * 14 + 3,
                    phase: Math.random() * Math.PI * 2,
                    color: ['#d8c49a', '#f0d98a', '#fbebbd', '#b8a98d'][Math.floor(Math.random() * 4)],
                    delay: Math.random() * 450,
                    size: Math.random() * 1.8 + 0.6
                };
            }

            for (let y = 0; y < sourceCanvas.height; y += stride) {
                for (let x = 0; x < sourceCanvas.width; x += stride) {
                    if (image.data[(y * sourceCanvas.width + x) * 4 + 3] > 100) {
                        particles.push(createParticle(rect.left + x / dpr, rect.top + y / dpr));
                    }
                }
            }

            if (!particles.length) {
                for (let index = 0; index < 40; index += 1) {
                    particles.push(createParticle(rect.left + rect.width / 2, rect.top + rect.height / 2));
                }
            }

            canvas.className = 'sand-canvas';
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            canvas.width = Math.ceil(viewportWidth * dpr);
            canvas.height = Math.ceil(viewportHeight * dpr);
            canvas.style.width = `${viewportWidth}px`;
            canvas.style.height = `${viewportHeight}px`;
            context.scale(dpr, dpr);
            document.body.appendChild(canvas);
            const startedAt = performance.now();
            const duration = 10000;

            function animate(now) {
                const elapsed = now - startedAt;
                context.clearRect(0, 0, viewportWidth, viewportHeight);

                particles.forEach(particle => {
                    const age = elapsed - particle.delay;
                    const seconds = Math.max(age, 0) / 1000;
                    if (age < 0) {
                        context.globalAlpha = 0.84 + Math.sin(now * 0.006 + particle.phase) * 0.16;
                        context.fillStyle = style.color;
                    } else {
                        const progress = Math.min(age / (duration - particle.delay), 1);
                        context.globalAlpha = (1 - progress) * (0.72 + Math.sin(now * 0.008 + particle.phase) * 0.28);
                        context.fillStyle = particle.color;
                    }

                    context.fillRect(
                        particle.x + particle.vx * seconds + 0.5 * particle.ax * seconds * seconds
                            + Math.sin(seconds * 2.2 + particle.phase) * particle.waveX,
                        particle.y + particle.vy * seconds + 0.5 * particle.ay * seconds * seconds
                            + Math.sin(seconds * 1.7 + particle.phase) * particle.waveY,
                        particle.size,
                        particle.size
                    );
                });

                context.globalAlpha = 1;
                if (elapsed < duration) {
                    requestAnimationFrame(animate);
                } else {
                    canvas.remove();
                    onComplete();
                }
            }

            requestAnimationFrame(animate);
            return true;
        }

        document.getElementById('btn').addEventListener('click', () => {
            const input = document.getElementById('inputArea');
            if (!input.value.trim()) return;
            const caveContainer = document.querySelector('.cave-container');
            const releaseButton = document.getElementById('btn');
            const releaseMessage = document.getElementById('release-message');
            const finishRelease = () => {
                caveContainer.classList.remove('is-releasing');
                input.disabled = false;
                releaseButton.disabled = false;
                releaseMessage.classList.remove('visible');
                releaseMessage.setAttribute('aria-hidden', 'true');
            };
            caveContainer.classList.add('is-releasing');
            input.disabled = true;
            releaseButton.disabled = true;
            releaseMessage.textContent = translate('releaseMessage');
            releaseMessage.removeAttribute('aria-hidden');
            releaseMessage.classList.add('visible');
            if (!releaseAsSand(input, finishRelease)) {
                finishRelease();
                return;
            }
            const cave = document.querySelector('.cave-container').getBoundingClientRect();
            sendRipple(cave.left + cave.width / 2, cave.top + cave.height / 2);
            vibrate(150);
        });

        const lonelyContainer = document.getElementById('lonely-lights-container');
        socket.on('update_lights', (lightsArray) => {
            lonelyContainer.innerHTML = '';
            lightElements = {};
            lightsArray.forEach(light => {
                const dot = document.createElement('div');
                const isCurrentUser = light.status !== 'residual' && light.id === visitorId;
                dot.className = `light-dot${light.status === 'residual' ? ' residual' : ''}`
                    + `${isCurrentUser && hasReceivedSoloGift ? ' blessed' : ''}`;
                dot.style.left = `${light.x}%`;
                dot.style.top = `${light.y}%`;
                dot.style.setProperty('--light-brightness', light.brightness || 0.45);

                if (isCurrentUser) {
                    dot.style.backgroundColor = '#a8ffb2';
                    dot.style.boxShadow = '0 0 15px #a8ffb2';
                }

                if (light.status === 'residual') {
                    dot.dataset.encouragementCount = light.encouragementCount || 0;
                    const caption = document.createElement('span');
                    caption.className = 'light-caption';
                    dot.appendChild(caption);
                }

                dot.addEventListener('click', (e) => {
                    sendRipple(e.clientX, e.clientY);
                    if (light.id !== visitorId) {
                        vibrate(80);
                        socket.emit('click_light', { targetId: light.id });
                    }
                });
                lonelyContainer.appendChild(dot);
                lightElements[light.id] = dot;
            });
            updateDynamicLightLabels();
        });

        document.getElementById('light-jar').addEventListener('click', () => {
            vibrate(80);
            socket.emit('deposit-light');
        });

        socket.on('light-jar-state', ({ count }) => {
            document.getElementById('light-jar-count').textContent = count;
        });

        function showCompanionToast(messageKey, duration = 5000) {
            const toast = document.getElementById('companion-toast');
            activeToastKey = messageKey;
            toast.textContent = translate(messageKey);
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('visible');
                activeToastKey = null;
            }, duration);
        }

        socket.on('solo-light-boost', ({ targetId }) => {
            if (targetId !== visitorId) return;

            const jarButton = document.getElementById('light-jar');
            const target = lightElements[targetId];
            hasReceivedSoloGift = true;
            if (target) target.classList.add('blessed');

            const finishGiftArrival = () => {
                if (target && target.isConnected && document.getElementById('lonely-page').classList.contains('active')) {
                    const targetRect = target.getBoundingClientRect();
                    const ripple = document.createElement('span');
                    ripple.className = 'gift-ripple';
                    ripple.style.left = `${targetRect.left + targetRect.width / 2}px`;
                    ripple.style.top = `${targetRect.top + targetRect.height / 2}px`;
                    document.body.appendChild(ripple);
                    ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
                }

                vibrate([80, 45, 80]);
                playGentleChime();
                showCompanionToast('soloToast', 20000);
            };

            if (target && document.getElementById('lonely-page').classList.contains('active')) {
                const jarRect = jarButton.getBoundingClientRect();
                const targetRect = target.getBoundingClientRect();
                const glow = document.createElement('span');
                glow.className = 'flying-glow';
                glow.textContent = '✦';
                glow.style.left = `${jarRect.left + jarRect.width / 2}px`;
                glow.style.top = `${jarRect.top + jarRect.height / 2}px`;
                document.body.appendChild(glow);

                const deltaX = targetRect.left + targetRect.width / 2 - jarRect.left - jarRect.width / 2;
                const deltaY = targetRect.top + targetRect.height / 2 - jarRect.top - jarRect.height / 2;
                glow.style.setProperty('--trail-angle', `${Math.atan2(deltaY, deltaX) * 180 / Math.PI + 180}deg`);
                const animation = glow.animate([
                    { transform: 'translate(-50%, -50%) scale(0.7)', opacity: 0.2 },
                    { transform: 'translate(-50%, -50%) scale(1.3)', opacity: 1, offset: 0.35 },
                    { transform: `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px)) scale(0.6)`, opacity: 0.2 }
                ], { duration: 2500, easing: 'ease-in-out' });
                animation.addEventListener('finish', () => {
                    glow.remove();
                    finishGiftArrival();
                }, { once: true });
            } else {
                setTimeout(finishGiftArrival, 2500);
            }
        });

        socket.on('light_triggered', (data) => {
            const { fromId, targetId } = data;
            if (targetId === visitorId) {
                vibrate([160, 90, 160]);
                playGentleChime();
            }
            [fromId, targetId].forEach(id => {
                const el = lightElements[id];
                if (el) {
                    el.classList.add('ignited');
                    const rect = el.getBoundingClientRect();
                    sendRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
                    setTimeout(() => el.classList.remove('ignited'), 1500);
                }
            });
        });

            
            
    </script>
